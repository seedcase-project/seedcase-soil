[project]
name = "seedcase-soil"
version = "0.16.0"
description = "Common ground shared by Seedcase Python packages."
authors = [
  { name = "Luke W. Johnston", email = "lwjohnst@gmail.com" },
  { name = "Marton Vago", email = "marton.vago95@gmail.com" },
  { name = "Joel Ostblom", email = "joel@joelostblom.com" },
]
maintainers = [
  { name = "Luke W. Johnston", email = "lwjohnst@gmail.com" },
  { name = "Marton Vago", email = "marton.vago95@gmail.com" },
  { name = "Joel Ostblom", email = "joel@joelostblom.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.10.1",
    "emoji>=2.15.0",
    "rich>=14.3.3",
    "seedir>=0.5.1",
]

# From https://pypi.org/classifiers/
classifiers = [
  "License :: OSI Approved :: MIT License",

  # Strict typing, checked via Pyrefly
  "Typing :: Typed",

  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
homepage = "https://soil.seedcase-project.org"

repository = "https://github.com/seedcase-project/seedcase-soil"
changelog = "https://github.com/seedcase-project/seedcase-soil/blob/main/CHANGELOG.md"
issues = "https://github.com/seedcase-project/seedcase-soil/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "commitizen>=4.13.9",
  "genbadge>=1.1.3",
  "jupyter>=1.1.1",
  "mypy>=1.20.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-mock>=3.15.1",
  "pytest-cov>=7.1.0",
  "quartodoc>=0.11.1",
  "ruff>=0.15.8",
  "types-tabulate>=0.10.0.20260308",
  "typos>=1.44.0",
  "vulture>=2.16",
]
[tool.pytest.ini_options]
# - A short traceback (tb) mode to make it easier to view.
# - Use the `src/` package (importlib).
# - Use code coverage on the `src/` package.
# - If tests fail, do not generate coverage report.
# - Create the coverage report in XML (for badge), terminal, and HTML.
# - Trigger failure if below 90% code coverage.
addopts = "--tb=short --import-mode=importlib --cov=src --no-cov-on-fail --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=90"

[tool.pyrefly]
project-includes = ["src/", "tests/"]
min-severity = "warn"
python-version = "3.12.0"
preset = "strict"
python-interpreter-path = ".venv/bin/python"
# Use inline `# type: ignore` comments, which can be useful.
permissive-ignores = true

[tool.ruff]
extend = ".config/ruff.toml"
